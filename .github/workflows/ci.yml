name: KASHFLOW CI

on:
  push:
    branches:
      - main
      - feature/public-home-auth
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Build frontend
        run: npm run build
